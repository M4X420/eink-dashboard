# Prueft bei jedem Push, ob die Integration den Regeln von HACS und Home Assistant (hassfest)
# entspricht, und ob die App baut. Ergebnisse: Reiter "Actions" auf GitHub.
name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # Das Android SDK ist auf den GitHub-Runnern vorinstalliert (ANDROID_HOME),
      # fehlende Plattform-Pakete laedt Gradle selbst nach.
      - run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
